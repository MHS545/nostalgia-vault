<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <!-- Parchment Sepia Gradient -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="60%" stop-color="#f5efe0"/>
      <stop offset="100%" stop-color="#e6d7bc"/>
    </radialGradient>

    <!-- Vintage Grain Filter -->
    <filter id="paper-noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feColorMatrix type="matrix" values="
        0.15 0 0 0 0.8
        0.12 0 0 0 0.72
        0.08 0 0 0 0.6
        0    0 0 0.05 0" in="noise" result="coloredNoise"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    
    <!-- Subtle Stains -->
    <radialGradient id="stain1" cx="20%" cy="30%" r="25%">
      <stop offset="0%" stop-color="#d4c09d" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d4c09d" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="stain2" cx="80%" cy="75%" r="30%">
      <stop offset="0%" stop-color="#cbb28b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#cbb28b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Parchment Background -->
  <rect width="100%" height="100%" fill="url(#vignette)"/>
  
  <!-- Subtle Vintage Watermarks & Stains -->
  <circle cx="160" cy="240" r="200" fill="url(#stain1)"/>
  <circle cx="640" cy="600" r="240" fill="url(#stain2)"/>
  
  <!-- Paper Texture Grain Overlay -->
  <rect width="100%" height="100%" fill="#7a5c37" filter="url(#paper-noise)" opacity="0.08"/>
</svg>
